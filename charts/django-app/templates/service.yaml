apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-django
  labels:
    app: {{ .Release.Name }}-django
spec:
  type: {{ .Values.service.type }}
  selector:
    app: {{ .Release.Name }}-django
  ports:
    # Named: the ServiceMonitor references the port by name.
    - name: http
      port: 80
      targetPort: http
