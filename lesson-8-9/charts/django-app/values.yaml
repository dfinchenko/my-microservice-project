# Contract between Jenkins and Argo CD: Jenkins writes image.tag, Argo CD reads it.
# Keep the key names image.repository and image.tag as they are — the pipeline
# reads the registry from `repository` and rewrites the single `tag:` line.
image:
  repository: 481297220170.dkr.ecr.us-east-1.amazonaws.com/lesson-8-9-ecr
  tag: latest
  pullPolicy: IfNotPresent

service:
  type: LoadBalancer
  port: 8000

# requests.cpu is what the HPA measures utilisation against.
resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 250m
    memory: 256Mi

autoscaling:
  minReplicas: 2
  maxReplicas: 6
  targetCPUUtilizationPercentage: 70

# Non-secret env vars for the ConfigMap
config:
  POSTGRES_HOST: db
  POSTGRES_PORT: 5432
  POSTGRES_USER: django_user
  POSTGRES_DB: django_db
  DJANGO_DEBUG: "True"
  DJANGO_ALLOWED_HOSTS: "*"

# Secret env vars for the Kubernetes Secret, never the ConfigMap
secrets:
  POSTGRES_PASSWORD: pass9764gd
  DJANGO_SECRET_KEY: django-insecure-dev-key-change-me

# In-cluster PostgreSQL, ephemeral storage
postgres:
  enabled: true
  image: postgres:14
  port: 5432
