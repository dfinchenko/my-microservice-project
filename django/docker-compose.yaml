# Local run of the image the pipeline builds, against a throwaway Postgres. The
# env var names match the Secret Terraform writes in the cluster.
#
#   docker compose up --build
#   curl http://localhost:8000/          # index
#   curl http://localhost:8000/healthz/  # database check
#   curl http://localhost:8000/metrics   # what Prometheus scrapes

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: djangodb
      POSTGRES_USER: djangouser
      POSTGRES_PASSWORD: djangopass
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U djangouser -d djangodb"]
      interval: 5s
      timeout: 3s
      retries: 10

  web:
    build: .
    ports:
      - "8000:8000"
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      POSTGRES_DB: djangodb
      POSTGRES_USER: djangouser
      POSTGRES_PASSWORD: djangopass
      DJANGO_DEBUG: "True"
      DJANGO_ALLOWED_HOSTS: "*"
      DJANGO_SECRET_KEY: django-insecure-local-only
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
